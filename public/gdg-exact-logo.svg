<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" fill="none">
  <!-- Exact GDG Logo with thick sticks, bold black outlines, Blue over Red, Green over Yellow -->
  <g id="gdg-brackets-logo">
    <!-- LEFT BRACKET < -->
    <g id="bracket-left">
      <!-- 1. RED PILL (Underneath) -->
      <!-- Black border -->
      <path d="M 152 50 L 72 130" stroke="#1A1A1A" stroke-width="66" stroke-linecap="round" />
      <!-- Red fill -->
      <path d="M 152 50 L 72 130" stroke="#EA4335" stroke-width="52" stroke-linecap="round" />

      <!-- 2. BLUE PILL (Overlapping on top of Red) -->
      <!-- Black border -->
      <path d="M 72 130 L 152 210" stroke="#1A1A1A" stroke-width="66" stroke-linecap="round" />
      <!-- Blue fill -->
      <path d="M 72 130 L 152 210" stroke="#4285F4" stroke-width="52" stroke-linecap="round" />
    </g>

    <!-- RIGHT BRACKET > -->
    <g id="bracket-right">
      <!-- 3. YELLOW/ORANGE PILL (Underneath) -->
      <!-- Black border -->
      <path d="M 288 130 L 208 210" stroke="#1A1A1A" stroke-width="66" stroke-linecap="round" />
      <!-- Yellow/Orange fill -->
      <path d="M 288 130 L 208 210" stroke="#FBBC05" stroke-width="52" stroke-linecap="round" />

      <!-- 4. GREEN PILL (Overlapping on top of Yellow) -->
      <!-- Black border -->
      <path d="M 208 50 L 288 130" stroke="#1A1A1A" stroke-width="66" stroke-linecap="round" />
      <!-- Green fill -->
      <path d="M 208 50 L 288 130" stroke="#34A853" stroke-width="52" stroke-linecap="round" />
    </g>
  </g>
</svg>
